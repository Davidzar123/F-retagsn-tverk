services:

  pc1:
    build: .
    container_name: pc1
    cap_add:
      - NET_ADMIN
    networks:
      switch1:
        ipv4_address: 172.30.10.10

  pc2:
    build: .
    container_name: pc2
    cap_add:
      - NET_ADMIN
    networks:
      switch1:
        ipv4_address: 172.30.10.11

  router:
    build: .
    container_name: router
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      switch1:
        ipv4_address: 172.30.10.1
      switch2:
        ipv4_address: 172.30.20.1

  pc3:
    build: .
    container_name: pc3
    cap_add:
      - NET_ADMIN
    networks:
      switch2:
        ipv4_address: 172.30.20.10

  server:
    build: .
    container_name: server
    cap_add:
      - NET_ADMIN
    command: >
      bash -c "service ssh start &&
               service nginx start &&
               sleep infinity"
    networks:
      switch2:
        ipv4_address: 172.30.20.20

networks:

  switch1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.254

  switch2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24
          gateway: 172.30.20.254